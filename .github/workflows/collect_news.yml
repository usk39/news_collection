name: Collect News

on:
  schedule:
    # 毎日 22:00 JST (13:00 UTC) に実行
    - cron: "0 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run news collector
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python collect_news.py

      - name: Upload report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: news-report-${{ github.run_id }}
          path: output/news_report_*.md

      - name: Commit latest report
        run: |
          git config user.name "news-collection-bot"
          git config user.email "actions@github.com"
          git add output/latest.md
          git diff --cached --quiet || git commit -m "chore: update latest news report"
          git push
